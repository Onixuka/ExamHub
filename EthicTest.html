            ];

            let currentQuestionId = 0;
            let answers = {};
            let feedbackShown = {};
            let score = 0;

            const quizContainer = document.getElementById("quiz-container");
            const questionButtonsContainer = document.getElementById("question-buttons");
            const questionButtonsSection = document.getElementById("question-buttons-section");
            const navigationButtons = document.getElementById("navigation-buttons");
            const prevButton = document.getElementById("prev-button");
            const nextButton = document.getElementById("next-button");
            const submitButton = document.getElementById("submit-button");
            const resultsSection = document.getElementById("results-section");
            const scoreText = document.getElementById("score-text");
            const resultsDetails = document.getElementById("results-details");
            const restartButton = document.getElementById("restart-button");

            function initQuiz() {
                quizContainer.innerHTML = "";
                questionButtonsContainer.innerHTML = "";
                answers = {};
                feedbackShown = {};
                score = 0;

                quizData.forEach((q, index) => {
                    const questionDiv = document.createElement("div");
                    questionDiv.id = `question-${index}`;
                    questionDiv.className = "quiz-question" + (index !== 0 ? " hidden" : "");
                    questionDiv.innerHTML = `
                        <h3 class="text-lg font-medium mb-2 text-indigo-800">คำถามที่ ${index + 1} จาก ${quizData.length}</h3>
                        <p class="text-base mb-4">${q.question}</p>
                        <div class="space-y-3">
                            ${q.options.map((option, i) => `
                                <div class="radio-option">
                                    <input type="radio" id="q${index}-${i}" name="q${index}" value="${i}">
                                    <label for="q${index}-${i}">${option}</label>
                                </div>
                            `).join("")}
                        </div>
                        <div class="feedback hidden" id="feedback-${index}"></div>
                    `;
                    quizContainer.appendChild(questionDiv);

                    const button = document.createElement("button");
                    button.className = "question-button" + (index === 0 ? " active" : "");
                    button.dataset.question = index;
                    button.textContent = index + 1;
                    button.addEventListener("click", () => showQuestion(Number(button.dataset.question)));
                    questionButtonsContainer.appendChild(button);
                });

                prevButton.addEventListener("click", () => {
                    if (currentQuestionId > 0) showQuestion(currentQuestionId - 1);
                });

                nextButton.addEventListener("click", () => {
                    const selected = document.querySelector(`input[name="q${currentQuestionId}"]:checked`);
                    if (selected) submitAnswer();
                    if (currentQuestionId < quizData.length - 1) {
                        showQuestion(currentQuestionId + 1);
                    } else {
                        updateSubmitButton();
                    }
                });

                submitButton.addEventListener("click", showResults);

                restartButton.addEventListener("click", () => {
                    resultsSection.style.display = "none";
                    quizContainer.style.display = "block";
                    questionButtonsSection.style.display = "block";
                    navigationButtons.style.display = "flex";
                    initQuiz();
                });

                document.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.addEventListener("change", () => {
                        submitAnswer();
                        updateSubmitButton();
                    });
                });

                showQuestion(0);
            }

            function showQuestion(id) {
                document.querySelectorAll(".quiz-question").forEach(q => q.classList.add("hidden"));
                document.getElementById(`question-${id}`).classList.remove("hidden");

                document.querySelectorAll(".question-button").forEach(btn => {
                    btn.classList.remove("active");
                    if (Number(btn.dataset.question) === id) btn.classList.add("active");
                });

                currentQuestionId = id;
                prevButton.disabled = id === 0;
                nextButton.disabled = id === quizData.length - 1 && feedbackShown[id];
                submitButton.classList.toggle("hidden", id !== quizData.length - 1 || Object.keys(answers).length === 0);
                nextButton.classList.toggle("hidden", id === quizData.length - 1 && feedbackShown[id]);
                updateSubmitButton();
            }

            function submitAnswer() {
                const selected = document.querySelector(`input[name="q${currentQuestionId}"]:checked`);
                if (!selected) return;

                const answer = Number(selected.value);
                if (answers[currentQuestionId] !== undefined && answers[currentQuestionId] === quizData[currentQuestionId].answer) {
                    score--;
                }
                answers[currentQuestionId] = answer;
                feedbackShown[currentQuestionId] = true;

                const question = quizData[currentQuestionId];
                const isCorrect = answer === question.answer;

                if (isCorrect) score++;

                const feedbackDiv = document.getElementById(`feedback-${currentQuestionId}`);
                feedbackDiv.classList.remove("hidden");
                feedbackDiv.classList.add(isCorrect ? "correct" : "incorrect");
                feedbackDiv.innerHTML = `
                    <div class="flex items-center gap-2 font-medium">
                        ${isCorrect ? `
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                            <span>ถูกต้อง!</span>
                        ` : `
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 IFICATE cx="12" cy="12" r="10"></circle>
                                <line x1="15" y1="9" x2="9" y2="15"></line>
                                <line x1="9" y1="9" x2="15" y2="15"></line>
                            </svg>
                            <span>ไม่ถูกต้อง</span>
                        `}
                    </div>
                    <p class="mt-1 text-sm">
                        ${isCorrect ? "ยอดเยี่ยม! คุณเลือกคำตอบที่ถูกต้อง" : `คำตอบที่ถูกต้องคือ ${question.options[question.answer]}`}
                    </p>
                `;

                document.querySelectorAll(`#question-${currentQuestionId} .radio-option`).forEach((option, i) => {
                    const input = option.querySelector("input");
                    input.disabled = true;
                    if (i === question.answer) option.classList.add("correct");
                    else if (i === answer && !isCorrect) option.classList.add("incorrect");
                });

                const button = document.querySelector(`.question-button[data-question="${currentQuestionId}"]`);
                button.classList.remove("correct", "incorrect");
                button.classList.add(isCorrect ? "correct" : "incorrect");

                updateSubmitButton();
            }

            function updateSubmitButton() {
                const allAnswered = Object.keys(answers).length === quizData.length;
                submitButton.disabled = !allAnswered;
                if (currentQuestionId === quizData.length - 1) {
                    submitButton.classList.remove("hidden");
                    nextButton.classList.toggle("hidden", feedbackShown[currentQuestionId]);
                }
            }

            function showResults() {
                quizContainer.style.display = "none";
                questionButtonsSection.style.display = "none";
                navigationButtons.style.display = "none";
                resultsSection.style.display = "block";

                scoreText.textContent = `คุณได้คะแนน ${score} จาก ${quizData.length} คะแนน (${(score / quizData.length * 100).toFixed(2)}%)`;

                resultsDetails.innerHTML = quizData.map((q, i) => `
                    <div class="mb-4">
                        <p class="font-medium ${answers[i] === q.answer ? "text-green-600" : "text-red-600"}">
                            คำถาม ${i + 1}: ${q.question}
                        </p>
                        <p>คำตอบของคุณ: ${answers[i] !== undefined ? q.options[answers[i]] : "ไม่ได้ตอบ"}</p>
                        <p>คำตอบที่ถูกต้อง: ${q.options[q.answer]}</p>
                    </div>
                `).join("");
            }

            initQuiz();
        });
    </script>
